services:
  app:
    build: .
    image: kaopu:local
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DATA_DIR: /data
      AUTH_COOKIE_SECURE: "true"
      TRUST_PROXY: "1"
      LESSON_FFMPEG: /usr/bin/ffmpeg
    volumes:
      - shifen-data:/data
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  shifen-data:
  caddy-data:
  caddy-config:
